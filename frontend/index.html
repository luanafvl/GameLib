<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@300;400;600;700&family=Zen+Dots&display=swap" rel="stylesheet">
</head>
<body>
    <!-- CABEÇALHO -->
    <header class="header">
        <nav class="nav">
            <a href="#hero">Home</a>
            <a href="#platforms">Platforms</a>
        </nav>
</header>
    <main>
        <!-- SESSÃO HERO -->
        <section class="section-1" id="hero">
            <div class="hero-content">
                <h1>GAMELIB</h1>
                <p>The <span>easiest</span> way to keep track of <span>all</span> your games</p>
            </div>
        </section>
        <!-- SESSÃO 2 -->
        <section class="section-2">
            <div class="game-examples">
                <div class="game-example-1">
                    <img src="images/cyberpunk-2077-bright.webp" alt="Cyberpunk 2077">
                    <h2>Cyberpunk 2077</h2>
                </div>
                <div class="game-example-2">
                    <img src="images/elden-ring-bright.png" alt="Elden Ring">
                    <h2>Elden Ring</h2>
                </div>
                <div class="game-example-3">
                    <img src="images/clair-obscur.webp" alt="Clair Obscur: Expedition 33">
                    <h2>Clair Obscur: Expedition 33</h2>
                </div>
            </div>
            <div class="website-goals">
                <p>SAVE TROPHIES</p>
                <p>SHARE YOUR PROGRESS</p>
                <p>ORGANIZE YOUR GAMES</p>
            </div>
        </section>
        <!-- SESSÃO 3 -->
        <section class="section-3" id="platforms">
            <h2>ALL IN A <span>SINGLE</span> WEBSITE</h2>
            <div class="platform-container">
                <img src="images/Xbox-logo.svg" alt="Xbox">
                <img src="images/Steam-logo.svg" alt="PlayStation">
                <img src="images/Nintendo-logo.svg" alt="Nintendo">
                <img src="images/Epic-Games-logo.svg" alt="Epic Games">
                <img src="images/Playstation-logo.svg" alt="Origin">
            </div>
        </section>
    </main>
    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 GameLib. All rights reserved.</p>
    </footer>
</body>
</html>
